name: Go Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  COVERAGE_MIN: "95"

jobs:
  unit:
    name: '🧪 Unit (${{ matrix.os }})'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Unit tests
        run: make test
      - name: Upload unit coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-unit
          path: cover/unit
          if-no-files-found: error

  verify:
    name: '🧬 Pinned bundle and generation check'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Verify the DDF pin and generated output
        run: make verify

  coverage-gate:
    name: '📊 Coverage gate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Download coverage
        uses: actions/download-artifact@v6
        with:
          pattern: cover-*
          path: cover-dl
      - name: Arrange coverage directories
        # download-artifact nests each artifact under cover-dl/<name>/ when the
        # pattern matches several, but flattens a single match into cover-dl/
        # itself; handle both so the gate works before the storage and e2e
        # layers exist.
        run: |
          mkdir -p cover
          if ls cover-dl/covmeta.* >/dev/null 2>&1; then
            mkdir -p cover/unit && cp -r cover-dl/. cover/unit/
          else
            for d in cover-dl/cover-*; do
              [ -d "$d" ] || continue
              name="${d##*/cover-}"; mkdir -p "cover/$name"; cp -r "$d"/. "cover/$name"/
            done
          fi
          find cover | head -50
      - name: Enforce minimum
        run: make coverage
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            cover/merged.html
            cover/packages.txt
          if-no-files-found: ignore

  fuzz-smoke:
    name: '🎲 Fuzz smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Fuzz smoke
        run: make fuzz-smoke
