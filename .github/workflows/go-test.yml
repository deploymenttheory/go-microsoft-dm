name: Go Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  COVERAGE_MIN: "95"

jobs:
  unit:
    name: '🧪 Unit (${{ matrix.os }})'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Unit tests
        run: make test
      - name: Upload unit coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-unit
          path: cover/unit
          if-no-files-found: error

  verify:
    name: '🧬 Pinned bundle and generation check'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Verify the DDF pin and generated output
        run: make verify

  storage:
    name: '🗄️ Storage contract (postgres, mysql)'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dm
          POSTGRES_PASSWORD: dm
          POSTGRES_DB: dm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: dm
          MYSQL_DATABASE: dm
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pdm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://dm:dm@localhost:5432/dm?sslmode=disable
      TEST_MYSQL_DSN: root:dm@tcp(localhost:3306)/dm?parseTime=true&multiStatements=true
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Storage contract suites
        run: make test-storage
      - name: Upload storage coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-storage
          path: cover/storage
          if-no-files-found: error

  e2e:
    name: '🔁 End-to-end (${{ matrix.store }})'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        store: [sqlite, inmem]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: End-to-end scenarios
        run: make test-e2e E2E_STORE=${{ matrix.store }}
      - name: Upload e2e coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover-e2e-${{ matrix.store }}
          path: cover/e2e-${{ matrix.store }}
          if-no-files-found: error

  coverage-gate:
    name: '📊 Coverage gate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit, storage, e2e]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          pattern: cover-*
          path: cover-dl
      - name: Arrange coverage directories
        # download-artifact nests each artifact under cover-dl/<name>/ when the
        # pattern matches several, but flattens a single match into cover-dl/
        # itself; handle both so the gate works before the storage and e2e
        # layers exist.
        run: |
          mkdir -p cover
          if ls cover-dl/covmeta.* >/dev/null 2>&1; then
            mkdir -p cover/unit && cp -r cover-dl/. cover/unit/
          else
            for d in cover-dl/cover-*; do
              [ -d "$d" ] || continue
              name="${d##*/cover-}"; mkdir -p "cover/$name"; cp -r "$d"/. "cover/$name"/
            done
          fi
          find cover | head -50
      - name: Enforce minimum
        run: make coverage
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            cover/merged.html
            cover/packages.txt
          if-no-files-found: ignore

  fuzz-smoke:
    name: '🎲 Fuzz smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Fuzz smoke
        run: make fuzz-smoke
